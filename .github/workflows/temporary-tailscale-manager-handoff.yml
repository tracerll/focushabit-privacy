name: Temporary Tailscale Manager handoff
on:
  pull_request:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild ZIP
        run: |
          xxd -r -p TailscaleManager.hex > TailscaleManager.app.zip
          shasum -a 256 TailscaleManager.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TailscaleManager-app
          path: TailscaleManager.app.zip
          if-no-files-found: error
